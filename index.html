<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scoring 4 Cricket</title>
<meta name="description" content="Live club cricket scoring">
<meta name="theme-color" content="#0B1E3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="S4C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<script src="cloud.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Big+Shoulders+Stencil+Display:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column. Coloured score band, crease detail, this over, then a thumb-reach keypad. Fixed bottom tabs. */
:root{
  --bg:#cfe1cb; --surface:rgba(255,255,255,.62); --surface-2:rgba(232,240,229,.62); --ink:#112018; --muted:#4f5f55; --line:rgba(30,70,45,.16);
  --field-glass:rgba(29,74,48,.86); --glass:rgba(255,255,255,.5);
  --bgimg:radial-gradient(90% 60% at 15% 0%,rgba(255,255,255,.65),transparent 60%),radial-gradient(80% 60% at 100% 100%,rgba(60,130,80,.35),transparent 60%),repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 70px,rgba(255,255,255,.14) 70px 140px),linear-gradient(160deg,#dcebd6,#a9cc9f);
  --field:#1d4a30; --field-ink:#f2f6ef; --field-muted:#b3cbbb;
  --accent:#b8261d; --accent-ink:#ffffff;
  --head:#2b6a48; --four:#1f6fb2; --six:#7a3fb0; --wkt:#b8261d; --extra:#9a6a0c; --good:#1f7a43;
  --f-num:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b140f; --surface:rgba(22,34,27,.6); --surface-2:rgba(36,52,42,.6); --ink:#e6ede7; --muted:#9db0a2; --line:rgba(160,210,175,.14); --field-glass:rgba(22,58,38,.85); --glass:rgba(16,26,20,.55); --bgimg:radial-gradient(90% 60% at 15% 0%,rgba(80,160,110,.22),transparent 60%),repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 70px,rgba(255,255,255,.025) 70px 140px),linear-gradient(160deg,#0f1d15,#07100b);
    --field:#163a26; --field-ink:#eef5ef; --field-muted:#93b8a0;
    --accent:#e5574c; --accent-ink:#1a0402;
    --head:#82c9a0; --four:#5aa8ea; --six:#b48ae6; --wkt:#ef6a5f; --extra:#e0b04a; --good:#5cc489; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b140f; --surface:rgba(22,34,27,.6); --surface-2:rgba(36,52,42,.6); --ink:#e6ede7; --muted:#9db0a2; --line:rgba(160,210,175,.14); --field-glass:rgba(22,58,38,.85); --glass:rgba(16,26,20,.55); --bgimg:radial-gradient(90% 60% at 15% 0%,rgba(80,160,110,.22),transparent 60%),repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 70px,rgba(255,255,255,.025) 70px 140px),linear-gradient(160deg,#0f1d15,#07100b);
  --field:#163a26; --field-ink:#eef5ef; --field-muted:#93b8a0;
  --accent:#e5574c; --accent-ink:#1a0402;
  --head:#82c9a0; --four:#5aa8ea; --six:#b48ae6; --wkt:#ef6a5f; --extra:#e0b04a; --good:#5cc489; color-scheme:dark;
}
/* Style: Floodlight (night match) */
:root[data-style="flood"]{
  --bg:#0a0f1e; --surface:#111a31; --surface-2:#18233f; --ink:#e9eeff; --muted:#8e9bbd; --line:#243052;
  --field:#0f1730; --field-ink:#ffffff; --field-muted:#a3b0d4;
  --accent:#ffb21f; --accent-ink:#1d1300;
  --four:#47b3ff; --six:#ffb21f; --wkt:#ff5d6c; --extra:#c79bff; --good:#4fd18b; color-scheme:dark;
}
/* Style: Scoreboard (painted board, stencil numerals) */
:root[data-style="board"]{
  --bg:#1e3326; --surface:#0f130f; --surface-2:#182018; --ink:#f3efe2; --muted:#a9b3a1; --line:#2f4535;
  --field:#0b0e0b; --field-ink:#f3efe2; --field-muted:#a3ad9d;
  --accent:#f0c53c; --accent-ink:#141000;
  --four:#f3efe2; --six:#f0c53c; --wkt:#ff6b57; --extra:#9fd3a8; --good:#9fd3a8; color-scheme:dark;
  --f-num:"Big Shoulders Stencil Display","Arial Narrow",Impact,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{background:var(--bgimg),var(--bg);background-attachment:fixed}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--field);color:var(--field-ink);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:15px;letter-spacing:.02em;position:relative}
.mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18)}
.brand b{font-weight:700;font-size:15px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.styles{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.styles button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted)}
.styles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

main{padding-block:14px 110px;display:grid;gap:14px}

/* score band */
.band{background:radial-gradient(120% 90% at 85% -30%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 60%),var(--field);color:var(--field-ink);border-radius:18px;padding:16px 18px 18px;display:grid;gap:4px}
:root[data-style="board"] .band{border:3px solid #2c3a2c;box-shadow:inset 0 0 0 1px #000}
.band-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--field-muted);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.pill.live{background:var(--accent);color:var(--accent-ink)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
.pill.sample{background:color-mix(in srgb,var(--field-ink) 14%,transparent);color:var(--field-ink)}
.pill.done{background:var(--good);color:var(--bg)}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}
.team-name{font-family:var(--f-num);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.big{font-family:var(--f-num);font-weight:800;font-size:78px;line-height:.9;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.big .wk{color:var(--field-muted);font-size:52px}
.band-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--field-muted);font-variant-numeric:tabular-nums}
.band-meta b{color:var(--field-ink);font-weight:600}
.chase{margin-top:8px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--field-ink) 10%,transparent);font-weight:600;font-size:14.5px}
.chase.fh{background:var(--accent);color:var(--accent-ink)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.panel h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.crease{display:grid;gap:2px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,40px);align-items:center;gap:4px;padding:6px 0;font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:0}
.prow.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:0}
.prow span:not(:first-child){text-align:right}
.prow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .r{font-weight:700;font-size:16px}
.strike{color:var(--accent);margin-left:4px}
.sub{font-size:12.5px;color:var(--muted)}
.pship{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding-top:8px;gap:8px;flex-wrap:wrap}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-width:34px;height:34px;padding:0 8px;border-radius:999px;display:inline-grid;place-items:center;font-weight:700;font-size:13.5px;background:var(--surface-2);color:var(--ink);font-variant-numeric:tabular-nums}
.chip.c4{background:var(--four);color:var(--bg)}
.chip.c6{background:var(--six);color:var(--bg)}
.chip.cw{background:var(--wkt);color:var(--bg)}
.chip.cx{background:transparent;border:1.5px solid var(--extra);color:var(--extra)}
.chip.empty{background:transparent;border:1.5px dashed var(--line)}
:root[data-style="board"] .chip.c4,:root[data-style="board"] .chip.c6{color:#111}

/* keypad */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:58px;font-family:var(--f-num);font-weight:800;font-size:28px;display:grid;place-items:center;font-variant-numeric:tabular-nums;transition:transform .06s}
.key:active{transform:scale(.96)}
.key small{display:block;font-family:var(--f-body);font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-top:-4px}
.key.k4{color:var(--four)} .key.k6{color:var(--six)}
.key.ex{font-family:var(--f-body);font-size:14px;font-weight:700;color:var(--extra);min-height:48px}
.key.util{font-family:var(--f-body);font-size:13.5px;font-weight:700;color:var(--muted)}
.key.wkt{grid-column:span 3;background:var(--wkt);color:var(--bg);border-color:transparent;font-size:24px;letter-spacing:.08em}

.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;text-align:left;display:grid;gap:1px;min-width:0}
.opt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt small{color:var(--muted);font-size:12px}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.callout{border-left:3px solid var(--accent);padding:10px 12px;background:var(--surface);border-radius:0 12px 12px 0}
.callout h2{margin:0 0 4px;font-size:17px}
.callout p{margin:0;color:var(--muted)}

/* scorecard */
.inn-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.inn-head h2{margin:0;font-family:var(--f-num);font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.inn-head .tot{font-family:var(--f-num);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px dashed var(--line);text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
td .how{display:block;font-size:12px;color:var(--muted);font-weight:400}
td.n{font-weight:600}

.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span:last-child{text-align:right;color:var(--muted)}
.fow{font-size:13px;color:var(--muted);line-height:1.7}
.log{display:grid;gap:0}
.logrow{display:grid;grid-template-columns:44px 40px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.logrow .ov{color:var(--muted);font-variant-numeric:tabular-nums}
.logrow .d{min-width:0}
.overhead{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 0 2px}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"Show";color:var(--accent);font-size:13px}
details[open] summary::after{content:"Hide"}

/* live */
.share{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:11px;padding:6px 6px 6px 12px}
.share code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;user-select:all}
.phone{max-width:360px;margin:0 auto;width:100%;border:8px solid var(--ink);border-radius:34px;overflow:hidden;background:var(--bg)}
.phone .notch{height:20px;display:flex;justify-content:center;align-items:center;background:var(--ink)}
.phone .notch i{width:70px;height:6px;border-radius:9px;background:var(--bg);opacity:.35}
.phone .scr{padding:12px;display:grid;gap:10px}
.phone .big{font-size:60px}.phone .big .wk{font-size:40px}
.vrow{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.vrow:last-child{border-bottom:0}
.overline{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:4px 0}
.overline .chips{gap:4px}.overline .chip{min-width:26px;height:26px;font-size:12px;padding:0 5px}

/* admin */
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.req:last-child{border-bottom:0}
.req b{display:block}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.ok{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.tag.no{background:color-mix(in srgb,var(--wkt) 18%,transparent);color:var(--wkt)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toggle{width:48px;height:28px;border-radius:999px;border:0;background:var(--surface-2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{left:23px;background:var(--accent-ink)}

/* forms */
.field{display:grid;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:200px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.steps{display:flex;gap:6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.steps span{flex:1;padding-top:6px;border-top:3px solid var(--line)}
.steps span.on{border-color:var(--accent);color:var(--ink)}
.err{color:var(--wkt);font-size:13px;font-weight:600}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;padding:10px 4px 12px;font-size:12px;font-weight:700;color:var(--muted);display:grid;justify-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:86vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{display:grid;gap:12px;padding-top:16px}
.sheet h2{margin:0;font-size:18px}
.sheet .lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sheet .pad .key{min-height:52px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;z-index:30}
.muted{color:var(--muted)}
/* glass */
.panel,.cpanel,.cardbox,.opt,.key,.sq-row,.actbar,.subtabs,.callout,.aopt,input,select,textarea{-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
header.top,nav.tabs,.sheet{background:var(--glass)!important;-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
body::before{background:var(--glass)!important}
.sband,.cbat,.batblock,.total-bar,.sq-row.on,.mt-team b.is-bat{background-color:var(--field-glass)}
.batblock,.cbat,.sband,.total-bar{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.maintabs{background:transparent}.maintabs button[aria-selected="true"]{background:var(--surface)}
/* actions */
.alist{display:grid;gap:8px}
.aopt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:grid;gap:2px}
.aopt b{font-size:15px}.aopt small{color:var(--muted);font-size:12.5px}
.aopt:disabled{opacity:.4;cursor:not-allowed}
.aopt.danger b{color:var(--wkt)}
/* home fit */
body.fit:not(.sc) main{max-width:980px}
body.fit .hbody{flex:1 1 auto;min-height:0;overflow:auto;display:grid;gap:10px;align-content:start}
body.fit .hfoot{flex:none}
body.fit .hbody .panel{flex:none}
.locked{opacity:.75;display:grid;gap:2px}
/* home */
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px}
.home-h{margin:6px 0 0;font-size:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.sq-row{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:11px;padding:4px 6px 4px 4px;background:var(--surface)}
.sq-row.on{background:var(--field);border-color:var(--field);color:#fff}
.sq-pick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:inherit;padding:6px;text-align:left}
.sq-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--muted);flex:none}
.sq-row.on .sq-n{background:#fff;color:var(--field)}
.sq-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roles{display:flex;gap:4px;flex:none}
.rchip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;font-size:11.5px;font-weight:800;padding:4px 7px;min-width:30px}
.sq-row.on .rchip{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.sq-row.on .rchip.on{background:#ffd166;border-color:#ffd166;color:#1a1400}
.rchip:disabled{opacity:.35;cursor:not-allowed}
.rtag{font-size:9px;font-weight:800;color:var(--muted);margin-left:3px;letter-spacing:.02em;vertical-align:1px}
.batblock .rtag{color:rgba(255,255,255,.75)}.batblock tr.cur .rtag{color:var(--field)}
.bowlblock tr.cur .rtag{color:rgba(255,255,255,.8)}
/* score tab two-part layout */
body.fit .col-info{display:flex;flex-direction:column;gap:8px;flex:none}
body.fit .col-act{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0}
body.fit .pad{flex:0 0 auto;grid-auto-rows:clamp(40px,6.6vh,54px);min-height:0}
body.fit .key{font-size:22px;border-radius:11px}
body.fit .key.ex{font-size:13px}
body.fit .key.wkt{font-size:20px}
.actbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;flex:none}
.actbar button{border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.actbar button:hover{background:var(--surface)}
.actbar .ai{color:var(--accent);font-size:14px;line-height:1}
/* scorecard: current batters and bowler in opposite colours */
.batblock tr.cur td{background:#fff;color:var(--field)}
.batblock tr.cur td .how{color:var(--field);opacity:.75}
.batblock tr.cur .star{color:var(--accent)}
.batblock tr.cur td:first-child{border-radius:8px 0 0 8px}.batblock tr.cur td:last-child{border-radius:0 8px 8px 0}
.bowlblock tr.cur td{background:var(--field);color:#fff}
.bowlblock tr.cur td:first-child{border-radius:8px 0 0 8px}.bowlblock tr.cur td:last-child{border-radius:0 8px 8px 0}
/* smaller toss icons, tighter names */
.coin{width:15px!important;height:15px!important}
.tc .bat{width:16px!important;height:16px!important}.tc .ball{width:13px!important;height:13px!important}
.mt-team b{font-size:13.5px}
/* tablet portrait */
@media (min-width:700px){
  .wrap{max-width:760px}
  body.fit .pad{grid-auto-rows:clamp(48px,6.4vh,64px)}
  body.fit .key{font-size:26px}
  .sband .big{font-size:64px}
}
/* tablet landscape and laptop: info left, keypad right */
@media (min-width:960px){
  .wrap{max-width:1160px}
  main:not(.x){padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  body.fit.sc main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:stretch}
  body.fit .col-info,body.fit .col-act{min-height:0;overflow:auto}
  body.fit .col-act .pad{flex:1 1 auto;grid-auto-rows:minmax(48px,1fr);max-height:520px}
  body.fit .key{font-size:30px}
  body.fit .key.ex{font-size:15px}
  .sband .big{font-size:76px}
  body:not(.sc) main{max-width:980px}
  .phone{max-width:380px}
}

/* current batters / bowler follow the theme */
.batblock tr.cur td{background:color-mix(in srgb,var(--hl) 36%,transparent);color:#fff}
.batblock tr.cur td .how{color:rgba(255,255,255,.85);opacity:1}
.batblock tr.cur .rtag{color:rgba(255,255,255,.85)}
.batblock tr.cur .star{color:#fff}
.bowlblock tr.cur td{background:color-mix(in srgb,var(--hl) 34%,transparent);color:var(--ink)}
.bowlblock tr.cur .rtag{color:var(--ink)}
/* team colours: A = batting first, B = bowling first */
:root{--ta:#2a7a45;--tb:#9a4fb8}
:root[data-style="flood"]{--ta:#2a62d6;--tb:#b97a0c}
:root[data-style="board"]{--ta:#2a7a45;--tb:#a8841a}
:root[data-style="gold"]{--ta:#b08a22;--tb:#4a78b0}
:root[data-style="cobalt"]{--ta:#1a90c6;--tb:#b38a3a}
.tA{--tc:var(--ta)}.tB{--tc:var(--tb)}
.sband.tA,.sband.tB{background:radial-gradient(120% 90% at 85% -30%,rgba(255,255,255,.14),transparent 60%),color-mix(in srgb,var(--tc) 58%,transparent)!important}
.cbat.tA,.cbat.tB,.batblock.tA,.batblock.tB,.total-bar.tA,.total-bar.tB{background-color:color-mix(in srgb,var(--tc) 56%,transparent)!important}
.bowlblock.tA,.bowlblock.tB{border-color:color-mix(in srgb,var(--tc) 75%,transparent);background:color-mix(in srgb,var(--tc) 10%,var(--surface))}
.bowlblock.tA table.sc th,.bowlblock.tB table.sc th{color:color-mix(in srgb,var(--tc) 60%,var(--ink));border-bottom-color:color-mix(in srgb,var(--tc) 70%,transparent)}
.bowlblock.tA table.sc th.sec,.bowlblock.tB table.sc th.sec{color:color-mix(in srgb,var(--tc) 65%,var(--ink))}
.bowlblock.tA,.bowlblock.tB{color:var(--ink)}
.cpanel .crow.bw.tA,.cpanel .crow.bw.tB{color:color-mix(in srgb,var(--tc) 55%,var(--ink));box-shadow:inset 4px 0 0 var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent)}
.cpanel .crow.bw.tA .xx,.cpanel .crow.bw.tB .xx{color:inherit}
.mt-team b.tA.is-bat,.mt-team b.tB.is-bat{background:color-mix(in srgb,var(--tc) 62%,transparent);color:#fff;border:1.5px solid transparent}
.mt-team b.tA.is-bowl,.mt-team b.tB.is-bowl{background:color-mix(in srgb,var(--tc) 12%,transparent);color:color-mix(in srgb,var(--tc) 60%,var(--ink));border:1.5px solid var(--tc)}
.subtabs button.tA,.subtabs button.tB{border-bottom:3px solid transparent}
.subtabs button.tA[aria-selected="true"],.subtabs button.tB[aria-selected="true"]{border-bottom-color:var(--tc);color:color-mix(in srgb,var(--tc) 55%,var(--ink))}
/* current rows take the other team's colour */
.otA{--oc:var(--ta)}.otB{--oc:var(--tb)}
.batblock tr.cur td{background:color-mix(in srgb,var(--oc,var(--hl)) 72%,transparent)!important;color:#fff}
.bowlblock tr.cur td{background:color-mix(in srgb,var(--oc,var(--hl)) 60%,transparent)!important;color:#fff}
.bowlblock tr.cur .rtag{color:rgba(255,255,255,.85)}
/* lighter glass for batting block, total bar and current rows */
.batblock.tA,.batblock.tB,.total-bar.tA,.total-bar.tB{background-color:color-mix(in srgb,var(--tc) 34%,transparent)!important;-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
.batblock tr.cur td{background:color-mix(in srgb,var(--oc,var(--hl)) 40%,transparent)!important}
.bowlblock tr.cur td{background:color-mix(in srgb,var(--oc,var(--hl)) 36%,transparent)!important}
.batblock,.total-bar{text-shadow:0 1px 2px rgba(0,0,0,.35)}
.chipopt{padding:7px 11px}.chipopt b{font-size:13.5px}
.sheet .lbl{margin-top:2px}
/* retired text, golden duck, lineup colours, over-end, ghost buttons */
.how.ret{color:#ffd166!important;font-weight:700}
.gduck{display:inline-grid;justify-items:center;line-height:1}.gduck .duck{color:#e8b923}.gduck small{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#e8b923}
.lineup.tA .lu-row,.lineup.tB .lu-row{border-left:4px solid var(--tc);padding-left:8px;background:color-mix(in srgb,var(--tc) 14%,transparent);border-radius:8px;margin-bottom:4px;border-bottom:0}
.lineup.tA .lu-n,.lineup.tB .lu-n{color:color-mix(in srgb,var(--tc) 60%,var(--ink));font-weight:800}
.ovbtns{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.btn.ghost{background:color-mix(in srgb,var(--ink) 12%,transparent)!important;color:var(--ink)!important;border:1px solid color-mix(in srgb,var(--ink) 28%,transparent)}
/* charts */
.fig{margin:0;display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.fig:first-child{border-top:0}
.fig figcaption{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.leg{display:inline-flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-weight:600;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px}
.leg i.dash{width:14px;height:0;border-top:2px dashed var(--muted);border-radius:0}
.leg i.wdot-k{border-radius:50%;background:var(--wkt)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tgt{stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4;opacity:.5}
.chart .ax{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.chart .lab{fill:var(--ink);font-size:10px;font-weight:700;font-family:var(--f-body)}
.chart .lab.mu{fill:var(--muted)}
.chart .wdot{fill:var(--wkt);stroke:var(--surface);stroke-width:1.5}
.chart .ring{stroke:var(--surface);stroke-width:2}
.chart .hov:hover rect:first-child{opacity:.8}
.parts{display:grid;gap:6px}
.prt{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:13px}
.prt .pw{color:var(--muted);font-size:11px;font-weight:700}.prt .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prt .pv{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}.prt .pv b{color:var(--ink)}
.prt .pb{grid-column:2/-1;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}.prt .pb i{display:block;height:100%;border-radius:4px}
.ww{max-width:320px;margin:0 auto;width:100%}.ww.big{max-width:340px}
.field{width:100%;height:auto;display:block;cursor:crosshair}
.f-out{fill:color-mix(in srgb,#3c8a4c 45%,transparent);stroke:rgba(255,255,255,.7);stroke-width:.012}
.f-in{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.008;stroke-dasharray:.03 .03}
.f-pitch{fill:#d8c48f;opacity:.9}
.f-t{fill:rgba(255,255,255,.85);font-size:.065px;font-weight:700;font-family:var(--f-body)}
/* potm, share, log */
.potm{display:grid;gap:4px;margin-top:8px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#ffd166 18%,transparent);border:1px solid color-mix(in srgb,#ffd166 45%,transparent)}
.potm .pl{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.potm b{font-size:16px}.potm select{margin-top:4px}
.cardimg{width:100%;max-width:420px;border-radius:14px;margin:0 auto;display:block;background:var(--surface-2);aspect-ratio:1/1}
.sumtxt{white-space:pre-wrap;font-family:var(--f-body);font-size:13px;background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:0;max-height:200px;overflow:auto;user-select:all}
.alog{display:grid}.arow{display:grid;grid-template-columns:62px 110px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.arow .at{color:var(--muted);font-variant-numeric:tabular-nums}.arow .ab{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:480px){.arow{grid-template-columns:54px minmax(0,1fr)}.arow .ab{display:none}}
.hrow b{font-size:13.5px;font-weight:600}
.toast.big{font-size:15px;padding:12px 18px;background:color-mix(in srgb,var(--accent) 88%,transparent);color:var(--accent-ink);border-radius:14px;max-width:min(92vw,560px);text-align:center}
.maintabs{grid-template-columns:repeat(4,minmax(0,1fr))}.maintabs button{font-size:15px;letter-spacing:.03em}.maintabs .lg{display:none}
@media (min-width:600px){.maintabs .lg{display:inline}.maintabs .shl{display:none}.maintabs button{font-size:17px}}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:4px 9px;border-radius:999px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
/* outdoor mode */
:root[data-outdoor] .panel,:root[data-outdoor] .cpanel,:root[data-outdoor] .cardbox,:root[data-outdoor] .key,:root[data-outdoor] .opt,:root[data-outdoor] .aopt,:root[data-outdoor] .sheet{background-color:var(--bg)!important;-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-outdoor] .key{border-width:2px;border-color:color-mix(in srgb,var(--ink) 35%,transparent);font-size:32px!important}
:root[data-outdoor] .key.ex{font-size:16px!important;font-weight:800}
:root[data-outdoor] body.fit .pad{grid-auto-rows:clamp(52px,8vh,74px)}
:root[data-outdoor] .crow,:root[data-outdoor] .sb-r{font-size:16px}
:root[data-outdoor] .sband,:root[data-outdoor] .cbat{background-color:var(--field)!important}
.bookfig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bookfig>div{background:var(--surface-2);border-radius:10px;padding:7px 10px;display:grid;gap:1px;min-width:0}
.bookfig>div.wide{grid-column:1/-1}
.bookfig span{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bookfig b{font-size:16px;font-variant-numeric:tabular-nums}.bookfig b.nb{font-size:13.5px;font-weight:500}
.chkbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chkbtns .btn.on{border-color:var(--good)!important;box-shadow:inset 0 0 0 1.5px var(--good)}
.chkbtns .btn.on.bad{border-color:var(--wkt)!important;box-shadow:inset 0 0 0 1.5px var(--wkt)}
.ck{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:none;padding:2px 8px;border-radius:999px;margin-left:6px}
.ck.ok{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.ck.diff{color:var(--wkt);background:color-mix(in srgb,var(--wkt) 16%,transparent)}
.subtabs.mini{width:auto;min-width:200px}.subtabs.mini button{padding:6px 12px;font-size:12.5px}
.bk{display:grid;gap:4px}
.bk-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:9px;background:var(--surface-2);font-size:13px}
.bk-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-t{font-weight:800;font-variant-numeric:tabular-nums}
.bk-seq,.bk-ovs{display:flex;flex-wrap:wrap;gap:3px;min-width:0}
.bk-seq i{font-style:normal;font-variant-numeric:tabular-nums;min-width:15px;text-align:center;font-weight:600}
.bk-seq i.f{color:var(--four);font-weight:800}.bk-seq i.s{color:var(--six);font-weight:800}.bk-seq i.w{color:var(--wkt);font-weight:800}
.bk-ov{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:7px;padding:1px 4px}
.bk-ov.live{border-style:dashed}
.bk-ov em{font-style:normal;font-size:9.5px;color:var(--muted);margin-right:2px}
.bk-ov i{font-style:normal;font-size:11.5px;font-weight:700;min-width:12px;text-align:center}
.bk-ov i.c4{color:var(--four)}.bk-ov i.c6{color:var(--six)}.bk-ov i.cw{color:var(--wkt)}.bk-ov i.cx{color:var(--extra)}
@media (max-width:420px){.bk-row{grid-template-columns:78px minmax(0,1fr) auto}}
.grt{width:100%}.grt button{white-space:normal;line-height:1.2}
.f-stump{fill:#f4f1e6}.f-bat{fill:var(--accent);stroke:#fff;stroke-width:.008}
.f-t.sm{font-size:.05px;font-weight:600;fill:rgba(255,255,255,.62)}
.f-side{font-size:5.6px;font-weight:800;fill:rgba(255,255,255,.38)}
.sb-chase{background:rgba(0,0,0,.34)!important;color:#fff!important;border:1px solid rgba(255,255,255,.2);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.sb-chase.fh{background:color-mix(in srgb,var(--accent) 85%,transparent)!important;color:var(--accent-ink)!important;text-shadow:none}
:root:not([data-style]) .batblock.tA,:root:not([data-style]) .batblock.tB,:root:not([data-style]) .total-bar.tA,:root:not([data-style]) .total-bar.tB{background-color:color-mix(in srgb,var(--tc) 74%,transparent)!important}
.batblock td .how,.batblock .rtag,.total-bar .tb-l small,.total-bar .tb-m{color:rgba(255,255,255,.9)!important}

@media (max-width:480px){table.sc{font-size:13px}table.sc th,table.sc td{padding-left:2px;padding-right:2px}table.sc th{font-size:11px;letter-spacing:.02em}table.sc th.sec{font-size:20px}.bowlblock,.batblock{padding:0 6px 2px}table.sc td.n{font-size:14px}}

/* teams, past matches */
.homenav{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}

<script>
const KEY='s4c-proto-v3';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CREDIT=['bowled','caught','lbw','stumped','hit wicket'];
const NODELIVERY=['retired hurt','retired out','retired not out','timed out'];
const KINDS=['bowled','caught','lbw','run out','stumped','hit wicket','obstructing the field','retired out','retired hurt','timed out'];
const FREEHIT_OK=['run out','obstructing the field','retired out','retired hurt','timed out'];

let S=(window.CLOUD&&CLOUD.viewer)?Object.assign(fresh(),{style:(load()||{}).style||'turf',prefs:(load()||{}).prefs,tab:'live'}):(load()||fresh());
let UI={sheet:null,w:null,err:'',ed:null,rv:{}};
function wkEnd(s){const w=UI.w;if(w.k!=='run out'||w.endSet)return;const odd=(w.r||0)%2===1;w.end=w.out===s.st?(odd?'st':'ns'):(odd?'ns':'st')}

function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){return null}}
function save(){if(window.CLOUD&&CLOUD.viewer)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.CLOUD)CLOUD.onSave(S)}

function fresh(){
  return {style:'turf',tab:'home',setup:null,wiz:null,teams:[],match:Object.assign(sampleMatch(),{deleted:true,end:{why:'Deleted',text:'No match yet'}}),
    admin:{open:false,reqs:[]}};
}

/* ---------- engine ---------- */
const WK_BY={leg:['bowled','caught','lbw','run out','stumped','hit wicket','obstructing the field','hit the ball twice'],
  wd:['stumped','run out','hit wicket','obstructing the field'],
  nb:['run out','obstructing the field','hit the ball twice']};
function wkAllowed(d,free){let l=WK_BY[d];if(free)l=l.filter(k=>WK_BY.nb.includes(k));return l}
const NEED_OUT=['run out','obstructing the field','retired hurt','retired out','retired not out','timed out'];
const NEED_F=['caught','run out','stumped'];
const RUNS_OK=['run out','obstructing the field'];
function overEnds(fmt,ol,od){return fmt==='tot6'?od>=6:fmt==='max8'?(ol>=6||od>=8):ol>=6}
function dismiss(w,bw,bo){
  const f=w.f!=null?bw.players[w.f]:'',f2=w.f2!=null?bw.players[w.f2]:'',b=bw.players[bo]||'';
  switch(w.k){
    case 'bowled':return 'b '+b;
    case 'caught':return w.sub?'c sub ('+w.sub+') b '+b:w.f===bo?'c & b '+b:'c '+f+' b '+b;
    case 'lbw':return 'lbw b '+b;
    case 'run out':{const a=w.sub?'sub ('+w.sub+')':f;return 'run out'+(a?' ('+a+(f2?' / '+f2:'')+')':'')}

    default:return w.k;
  }
}
function innOvers(m,k){const inn=m.inns[k];return inn.so?1:(inn.overs!=null?+inn.overs:+m.overs)}
function sameKind(a,b){return !a.so===!b.so}
function penTo(m,j){const t=m.inns[j].bowl;
  for(let x=j+1;x<m.inns.length;x++)if(m.inns[x].bat===t&&sameKind(m.inns[x],m.inns[j]))return x;
  for(let x=j-1;x>=0;x--)if(m.inns[x].bat===t&&sameKind(m.inns[x],m.inns[j]))return x;return -1}
function derive(m,k){

  const B={},W={},order=[],wOrder=[];
  const bat=id=>{if(!B[id]){B[id]={id,r:0,b:0,f:0,s:0,out:null,outs:0};order.push(id)}return B[id]};
  const bowl=id=>{if(!W[id]){W[id]={id,o:0,b:0,full:0,r:0,w:0,m:0,wd:0,nb:0};wOrder.push(id)}return W[id]};
  let extra=0,snap=null,ovB={},absN=0;
  let total=0,wk=0,ov=0,ol=0,od=0,st=null,ns=null,bo=null,last=null,free=false,bor=0,started=false,pr=0,pb=0;
  let keeper=bw.wk!=null?bw.wk:null,lastOut=null,retN=0;
  const ex={b:0,lb:0,wd:0,nb:0,p:0,wp:0},fow=[],log=[],overs=[],parts=[];let cur=[];

  function endOver(lone){
    const ids=Object.keys(ovB),q={st,ns,bo,last,ol,od,bor,ovB:{...ovB},W:{},pd:[]};ids.forEach(id=>{const w=W[id];q.W[id]={full:w.full,b:w.b,m:w.m}});
    if(ids.length===1){const w=W[ids[0]];w.full++;w.b-=ovB[ids[0]];if(bor===0)w.m++}

        Object.keys(q.W).forEach(id=>Object.assign(W[id],q.W[id]));q.pd.forEach(id=>{if(B[id])B[id].pairDone=false});extra++;snap=null;log.push({i,lab:lab(),chip:'+1',cls:'cx',desc:'Long over · umpire allowed another ball',edit:false})}}

    else if(e.t==='csub'){if(st===e.from)st=e.to;else if(ns===e.from)ns=e.to;if(B[e.from])B[e.from].out=B[e.from].out||'replaced · concussion sub';bat(e.to);
        if(bo===e.from){bo=e.to;bowl(e.to)}log.push({i,lab:lab(),chip:'CS',cls:'cx',desc:names[e.to]+' replaces '+names[e.from]+' (concussion)',edit:false})}
    else if(e.t==='pen'){
      if(e.to==='field')log.push({i,lab:lab(),chip:'5p',cls:'cx',desc:'5 penalty runs to '+bw.name,edit:false});
      else{total+=e.r;ex.p+=e.r;log.push({i,lab:lab(),chip:'5p',cls:'cx',desc:'5 penalty runs to '+m.teams[inn.bat].name,edit:false})}}
    else if(e.t==='ret'){
      const O=bat(e.id);O.out=e.k;if(e.k==='retired not out'&&!O.ret){O.ret=true;O.retSeq=++retN}if(e.k!=='retired hurt'&&e.k!=='retired not out')lastOut=e.id;
      if(e.k!=='retired hurt'&&e.k!=='retired not out'){wk++;fow.push({wk,total,id:e.id,ov:lab()});parts.push({r:pr,b:pb,a:st,c:ns});pr=0;pb=0}
      if(st===e.id)st=null;else if(ns===e.id)ns=null;
      log.push({i,lab:lab(),chip:'R',cls:'cw',desc:names[e.id]+' '+e.k,edit:false});
    }
    else if(e.t==='ball'){
      if(od===0&&ol===0)snap=snap;if(e.who!=null&&e.who===ns&&st!==null)[st,ns]=[ns,st];
      const lone=(st===null)!==(ns===null);if(lone&&st===null){st=ns;ns=null}
      const bid=e.bw!=null?e.bw:bo;
      const x=e.x||'',r=e.r||0,xr=e.xr||0,S1=bat(st),Bw=bowl(bid);
      const st0=st,ns0=ns;
      let runs=0,chip,cls='';
      if(x==='wd'){runs=1+xr;ex.wd+=runs;Bw.r+=runs;Bw.wd++;bor+=runs;chip=(xr?(1+xr):'')+'wd';cls='cx'}
      else if(x==='nb'){runs=1+r+xr;ex.nb++;if(xr)ex[e.nbx||'b']+=xr;S1.r+=r;S1.b++;Bw.r+=1+r;Bw.nb++;bor+=1+r;if(r===4)S1.f++;if(r===6)S1.s++;chip=(r+xr?(r+xr):'')+'nb';cls='cx'}
      else if(x==='b'||x==='lb'){runs=xr;ex[x]+=xr;S1.b++;chip=xr+x;cls='cx'}
      else{runs=r;S1.r+=r;S1.b++;Bw.r+=r;bor+=r;if(r===4)S1.f++;if(r===6)S1.s++;chip=r===0?'•':String(r);cls=r===4?'c4':r===6?'c6':''}
      total+=runs;pr+=runs;if(x!=='wd')pb++;
      const legal=x!=='wd'&&x!=='nb';
      od++;if(legal)ol++;
      if(legal||m.fmt==='tot6'){Bw.b++;ovB[bid]=(ovB[bid]||0)+1}
      const L=lab();
      let desc=bw.players[bid]+' to '+names[st]+': ';
      desc+=x==='wd'?(runs+' wide'+(runs>1?'s':'')):x==='nb'?('no ball'+(r?', '+r+' off the bat':'')+(xr?', '+xr+' '+(e.nbx||'b'):'')):x?(xr+' '+(x==='b'?'bye':'leg bye')+(xr>1?'s':'')):(r===0?'no run':r===4?'FOUR':r===6?'SIX':r+' run'+(r>1?'s':''));
      if(free&&x!=='wd')desc+=' (free hit)';
      if(x!=='wd'){S1.seq=S1.seq||[];S1.seq.push(x==='nb'?(r?r+'':'·')+'ⁿ':(x==='b'||x==='lb')?'·':r?String(r):'·')}
      if(e.w){
        const O=bat(e.w.out),how=dismiss(e.w,bw,bid);
        if(e.w.out===st0&&x!=='wd'){S1.seq[S1.seq.length-1]=(S1.seq[S1.seq.length-1]==='·'?'':S1.seq[S1.seq.length-1])+'W'}else{O.seq=O.seq||[];O.seq.push('W')}
        if(CREDIT.includes(e.w.k))Bw.w++;
        wk++;
        if(PR){O.outs++;total-=PR.pen;ex.wp+=PR.pen;desc+=' · OUT '+names[e.w.out]+', '+how+' (−'+PR.pen+')'}
        else{O.out=how;lastOut=e.w.out;fow.push({wk,total,id:e.w.out,ov:L});parts.push({r:pr,b:pb,a:st0,c:ns0});pr=0;pb=0;desc+=' · OUT '+names[e.w.out]+', '+how}
        chip='W';cls='cw';
      }
      const cross=(x==='wd'||x==='b'||x==='lb')?xr:x==='nb'?r+xr:r;
      if(cross%2===1&&!lone)[st,ns]=[ns,st];
      if(e.w&&!PR&&lone){st=null}
      else if(e.w&&!PR){
        if(e.w.k==='run out'&&e.w.end){const surv=e.w.out===st?ns:st;if(e.w.end==='st'){st=null;ns=surv}else{ns=null;st=surv}}
        else{if(st===e.w.out)st=null;else if(ns===e.w.out)ns=null}
      }
      cur.push({chip,cls});
      log.push({i,lab:L,chip,cls,desc,edit:true,legal,st0,ns0,bo0:bid,x,runs:runs-(PR&&e.w?PR.pen:0),ovi:+L.split('.')[0]-(+L.split('.')[1]===0?1:0),wkt:!!e.w,ww:e.ww,bat:st0,roff:(x===''||x==='nb')?r:0});
      if(overEnds(m.fmt,ol-extra,od-extra))endOver(lone);
      free=(x==='nb'&&e.fh!==false&&m.freeHit!==false)?true:x==='wd'?free:false;
    }
  });
  Object.values(W).forEach(w=>{w.o=w.full+Math.floor(w.b/6);w.b=w.b%6});
  if(started&&(st!=null||ns!=null))parts.push({r:pr,b:pb,a:st!=null?st:ns,c:st!=null?ns:null,cur:true});
  return {parts,inn,B,W,order,wOrder,total,wk,ov,ol,od,st,ns,bo,last,free,ex,fow,log,overs,cur,started,pr,pb,keeper,ovl,PR,lastOut,absN,extra};
}
function teamSum(m,t,upto){let s=0;for(let j=0;j<upto&&j<m.inns.length;j++)if(m.inns[j].bat===t&&!m.inns[j].so)s+=derive(m,j).total;return s}
const DLS_B=0.02741,DLS_F=[1,0.88475,0.76014,0.63049,0.50001,0.37529,0.26175,0.16416,0.08878,0.03506],DLS_D=1-Math.exp(-50*DLS_B);
function dlsR(u,w){w=Math.min(w,9);if(u<=0)return 0;u=Math.min(u,50);const F=DLS_F[w];return F*(1-Math.exp(-DLS_B*u/F))/DLS_D*100}
function innRes(m,k){const inn=m.inns[k],N=inn.dlsN!=null?inn.dlsN:(inn.overs!=null&&!(inn.cuts||[]).length?+inn.overs:+m.overs);let R=dlsR(N,0);(inn.cuts||[]).forEach(c=>{R-=dlsR(c.u1,c.w)-dlsR(c.u2,c.w)});return Math.max(0,R)}
function dlsTarget(m){if(!m.inns[1])return null;const S=derive(m,0).total,R1=innRes(m,0),R2=innRes(m,1),G=+m.g50||200;
  return R2<=R1?Math.floor(S*R2/R1)+1:Math.floor(S+G*(R2-R1)/100)+1}
function dlsPar(m){const s=stateOf(m,1),S=derive(m,0).total,R1=innRes(m,0),R2=innRes(m,1),G=+m.g50||200,left=s.ovl?Math.max(0,s.ovl-s.ballsGone/6):0;
  const used=R2-dlsR(left,s.wk);return Math.floor(used<=R1?S*used/R1:S+G*(used-R1)/100)}
function targetOf(m,k){
  const inn=m.inns[k];if(inn.target)return +inn.target;
  if(m.dls&&k===1&&m.innsPer!==2&&!inn.so)return dlsTarget(m);
  if(inn.so)return k%2===1?derive(m,k-1).total+1:null;
  if(m.innsPer===2){if(k!==3)return null;return teamSum(m,inn.bowl,3)-teamSum(m,inn.bat,3)+1}
  return k===1&&!m.pairs?derive(m,0).total+1:(k===1?derive(m,0).total+1:null);
}
function eligible(m,d){const T=m.teams[d.inn.bat],cs=T.cs||[],fill=T.fill||[],n=T.players.length,bm=m.batMax&&!d.inn.so?Math.min(m.batMax,n):n;let l=[...Array(bm).keys()].filter(i=>!cs.some(c=>c.to===i)&&!fill.includes(i));
  if(m.repRet&&bm<n&&Object.values(d.B).some(b=>b.ret)){const nx=[...Array(n).keys()].find(i=>i>=bm&&!cs.some(c=>c.to===i)&&!fill.includes(i));if(nx!=null)l.push(nx)}
  fill.forEach(i=>{if(!l.includes(i))l.push(i)});cs.forEach(c=>{l=l.filter(i=>i!==c.from);if(!l.includes(c.to))l.push(c.to)});return l}
function availBatters(m,d){const el=eligible(m,d),B=d.B,inC=i=>i===d.st||i===d.ns;
  const fresh=el.filter(i=>!B[i]&&!inC(i));if(d.PR)return fresh;
  const hurt=Object.values(B).filter(b=>!inC(b.id)&&(b.out==='retired hurt'||b.out==='absent hurt')).map(b=>b.id);
  if(m.repRet&&m.batMax&&m.batMax<m.teams[d.inn.bat].players.length){
    const rets=Object.values(B).filter(b=>b.ret).sort((a,b)=>a.retSeq-b.retSeq),rep1=rets[0];
    const waiting=rets.slice(1).filter(b=>!inC(b.id)&&b.out==='retired not out');
    return fresh.concat(hurt,!fresh.length&&waiting.length?[waiting[0].id]:[])}
  const back=Object.values(B).filter(b=>!inC(b.id)&&b.out==='retired not out'&&!fresh.length).map(b=>b.id);
  return fresh.concat(hurt,back)}
function replacedId(m,d){if(!(m.repRet&&m.batMax))return null;const r=Object.values(d.B).filter(b=>b.ret).sort((a,b)=>a.retSeq-b.retSeq)[0];return r?r.id:null}
function stateOf(m,k){
  const d=derive(m,k),inn=d.inn,n=m.teams[inn.bat].players.length,ovl=d.ovl;
  const target=targetOf(m,k),av=availBatters(m,d),atC=(d.st!=null)+(d.ns!=null),LMS=!!(m.lms&&!inn.so&&!d.PR);

function cur(){return S.match.inns.length-1}
function ord(m){return [m.inns[0].bat,m.inns[0].bowl]}
function tcl(m,i){return i===ord(m)[0]?'tA':'tB'}
function vs(m){const o=ord(m);return esc(m.teams[o[0]].name)+' v '+esc(m.teams[o[1]].name)}
function oversTxt(s,m){return s.ov+'.'+(m.fmt==='tot6'?s.od:s.ol)}
function rate(r,balls){return balls?(r/balls*6).toFixed(2):'0.00'}

function foOk(m){if(m.innsPer!==2||m.inns.length!==2)return false;const lead=derive(m,0).total-derive(m,1).total;return lead>=(m.foLead||100)}
function wonBy(m,k,s){const t=m.teams[m.inns[k].bat].name,w=s.maxW-s.wk-(s.absN||0);return t+' won by '+w+' wicket'+(w===1?'':'s')}
function resultOf(m){
  if(m.end)return m.end.text;
  const L=m.inns.length,nm=i=>m.teams[i].name;
  if(m.innsPer===2){
    if(L<3)return null;
    if(L===3){const s3=stateOf(m,2);if(!s3.done)return null;const X=m.inns[2].bat,Y=m.inns[2].bowl,a=teamSum(m,X,3),b=teamSum(m,Y,3);
      return a<b?nm(Y)+' won by an innings and '+(b-a)+' run'+(b-a===1?'':'s'):null}
    const s4=stateOf(m,3);if(!s4.done)return null;
    if(s4.total>=s4.target)return wonBy(m,3,s4);
    if(s4.total===s4.target-1)return 'Match tied';
    const by=s4.target-1-s4.total;return nm(m.inns[3].bowl)+' won by '+by+' run'+(by===1?'':'s');
  }
  if(L<2)return null;const s2=stateOf(m,1);if(!s2.done)return null;
  if(m.dls&&m.inns[1].end==='Weather or time'&&s2.total<s2.target){const par=dlsPar(m),t1=nm(m.inns[0].bat),t2=nm(m.inns[1].bat);
    return s2.total>par?t2+' won by '+(s2.total-par)+' run'+(s2.total-par===1?'':'s')+' (DLS)':s2.total===par?'Match tied (DLS)':t1+' won by '+(par-s2.total)+' run'+(par-s2.total===1?'':'s')+' (DLS)'}
  const t1=nm(m.inns[0].bat);let main;
  const rev=m.dls&&(m.inns[0].cuts||m.inns[1].cuts||m.inns[1].overs!=null)?' (DLS)':m.inns[1].target||m.inns[1].overs!=null?' (revised target)':'';
  if(m.pairs){const a=derive(m,0).total,b=s2.total;main=b>a?nm(m.inns[1].bat)+' won by '+(b-a)+' run'+(b-a===1?'':'s'):a>b?t1+' won by '+(a-b)+' run'+(a-b===1?'':'s'):'tie'}
  else if(s2.total>=s2.target)main=wonBy(m,1,s2);
  else if(s2.total===s2.target-1)main='tie';
  else{const by=s2.target-1-s2.total;main=t1+' won by '+by+' run'+(by===1?'':'s')}
  if(main!=='tie')return main+rev;
  if(L<3)return 'Match tied';
  if(L<4)return null;const s4=stateOf(m,3);if(!s4.done)return null;
  if(s4.total>=s4.target)return 'Match tied · '+nm(m.inns[3].bat)+' won the super over';
  if(s4.total===s4.target-1)return 'Match tied · super over tied';
  return 'Match tied · '+nm(m.inns[2].bat)+' won the super over';
}

function sampleMatch(){
  const m={title:'Nepean Hawks v Emu Plains',sample:true,overs:20,fmt:'std',
    teams:[{name:'Nepean Hawks',c:0,vc:2,wk:4,players:['A. Sharma','J. Wilson','R. Patel','M. Chen',"D. O'Brien",'S. Reddy','T. Nguyen','L. Harris','K. Singh','B. Taylor','P. Kumar']},
           {name:'Emu Plains',c:1,wk:3,players:['C. Murphy','V. Rao','N. Ahmed','G. Brown','H. Lee','E. Walsh','F. Ali','I. Smith','O. Clarke','W. Das','Z. Khan']}],
    toss:{w:1,d:'bowl'},freeHit:true,innsPer:1,maxOv:4,retireAt:0,pairs:null,inns:[{bat:0,bowl:1,ev:[{t:'start',st:0,ns:1,bo:10}]}]};
  let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const bowlers=[10,9,8,7,6];let bi=1,wkK=['caught','bowled','lbw','caught','run out'],wi=0,guard=0;
  while(guard++<400){
    const s=stateOf(m,0);
    if(s.ov>=12&&s.ol>=3)break;
    const ev=m.inns[0].ev;
    if(s.need==='bat'){for(let p=0;p<11;p++){if(!s.B[p]&&p!==s.st&&p!==s.ns){ev.push({t:'bat',id:p});break}}continue}
    if(s.need==='bowl'){let b=bowlers[bi++%5];if(b===s.last)b=bowlers[bi++%5];ev.push({t:'bowl',id:b});continue}
    const v=rnd();
    if(v<.34)ev.push({t:'ball',r:0});
    else if(v<.64)ev.push({t:'ball',r:1});
    else if(v<.73)ev.push({t:'ball',r:2});
    else if(v<.75)ev.push({t:'ball',r:3});
    else if(v<.86)ev.push({t:'ball',r:4});
    else if(v<.90)ev.push({t:'ball',r:6});
    else if(v<.93)ev.push({t:'ball',x:'wd',xr:0});
    else if(v<.945)ev.push({t:'ball',x:'nb',r:1});
    else if(v<.96)ev.push({t:'ball',x:'lb',xr:1});
    else{const k=wkK[wi++%5];ev.push({t:'ball',r:0,w:{k,out:s.st,f:k==='caught'||k==='run out'?[0,2,4,5,3][wi%5]:null}})}
  }
  return m;
}

  if(m.innsPer===2&&k>=1&&!res){const me=teamSum(m,s.inn.bat,k)+s.total,op=teamSum(m,s.inn.bowl,k+1);const d=me-op;chase+=`<div class="sb-chase">${d>0?'Lead by '+d:d<0?'Trail by '+(-d):'Scores level'}</div>`}
  if(m.dls&&k===1&&!s.done&&!res)chase+=`<div class="sb-chase">DLS par now: ${dlsPar(m)}</div>`;
  if(s.PR)chase+=`<div class="sb-chase">Pairs · pair ${Math.floor(s.ov/s.PR.ov)+1} · −${s.PR.pen} per wicket</div>`;
  if(s.free&&!s.done)chase+=`<div class="sb-chase fh">Free hit next ball</div>`;
  const third=s.target?`Target <b>${s.target}</b>`:(!s.done&&s.ballsGone&&s.ovl?`Proj <b>${Math.round(s.total/s.ballsGone*s.ovl*6)}</b>`:`v ${esc(m.teams[s.inn.bowl].name)}`);
  return `<section class="sband ${tcl(m,s.inn.bat)}"><div><div class="sb-team">${tn(m,s.inn.bat)} ${pill}${s.inn.so||m.innsPer===2?`<span class="pill sample">${s.inn.so?'Super over':innLabel(m,k).replace(' innings','')}</span>`:''}</div><div class="big">${s.total}<span class="wk">/${s.wk}</span></div></div>
    <div class="sb-r"><span><b>${oversTxt(s,m)}</b>${s.ovl?' / '+s.ovl:''} ov</span><span>CRR <b>${rate(s.total,s.ballsGone)}</b></span><span>${third}</span></div>${chase}</section>`;
}
const THEMES=[
  {k:'turf',n:'Turf',c:['#1d4a30','#b8261d','#cfe1cb']},
  {k:'flood',n:'Floodlight',c:['#0a0f1e','#ffb21f','#47b3ff']},
  {k:'board',n:'Scoreboard',c:['#0b0e0b','#f0c53c','#f3efe2']},
  {k:'gold',n:'Black & Gold',c:['#0B0B0B','#D4AF37','#FFFFFF']},
  {k:'cobalt',n:'Cobalt & Gold',c:['#0D2A5E','#1FA6E0','#D4B26D']},
  {k:'classic',n:'S4C Classic',c:['#0B1E3F','#D4AF37','#FFFFFF']}];
function themePicker(who){const t=THEMES.find(x=>x.k===S.style)||THEMES[0];return `<section class="panel"><div class="switch"><div style="min-width:0"><b>Theme</b><div class="sub">${who}</div></div>
  <div class="thsel"><span class="sw sm">${t.c.map(c=>`<i style="background:${c}"></i>`).join('')}</span><select id="theme-sel" data-theme-sel="1" aria-label="Theme">${THEMES.map(x=>`<option value="${x.k}" ${x.k===S.style?'selected':''}>${x.n}</option>`).join('')}</select></div></div></section>`}
function sn(n){n=String(n).trim();const w=n.split(/\s+/).filter(Boolean);return n.length>=12&&w.length>1?w.map(x=>x[0]).join('').toUpperCase():n}
function snH(n){return `<span title="${esc(n)}">${esc(sn(n))}</span>`}
function ini(n){const w=String(n).trim().split(/\s+/).filter(Boolean);return w.length>1?w.map(x=>x[0]).join('').toUpperCase():w[0].slice(0,3).toUpperCase()}
function tn(m,i){const n=m.teams[i].name;const short=m.teams.some(t=>sn(t.name)!==t.name.trim());return `<span title="${esc(n)}">${esc(short?ini(n):n)}</span>`}
function miniCrease(m,s){
  const P=m.teams[s.inn.bat].players,Q=m.teams[s.inn.bowl].players;
  const br=id=>{if(id===null)return `<div class="crow"><span class="nm muted">Waiting for batter</span><span></span><span></span></div>`;
    const b=s.B[id];return `<div class="crow"><span class="nm">${esc(P[id])}${id===s.st?BAT:''}</span><span class="rr">${b.r} <small>(${b.b})</small></span><span class="xx">${b.f}×4 ${b.s}×6</span></div>`};
  const bid=s.bo!==null?s.bo:s.last;const w=bid!==null?s.W[bid]:null;
  const items=s.cur.map(c=>`<span class="chip ${c.cls}">${esc(c.chip)}</span>`);
  for(let i=s.cur.filter(c=>c.cls!=='cx'||/[bl]$/.test(c.chip)).length;i<6;i++)items.push('<span class="chip empty"></span>');
  const second=s.lone?`<div class="crow"><span class="nm muted">Last man · runner: ${s.lastOut!=null?esc(P[s.lastOut]):'—'}</span><span></span><span></span></div>`:br(s.ns);
  return `<section class="cpanel"><div class="cbat ${tcl(m,s.inn.bat)}">${br(s.st)}${second}</div>
    ${w?`<div class="crow bw ${tcl(m,s.inn.bowl)}"><span class="nm">${s.bo!==null?BALL:''}<span style="overflow:hidden;text-overflow:ellipsis">${esc(Q[bid])}</span></span><span class="rr">${w.w}-${w.r}</span><span class="xx">${w.o}.${w.b} ov</span></div>`:''}
    <div class="ostrip"><span class="lbl">This over</span><div class="chips">${items.join('')}</div><span class="ps">P'ship<br><b>${s.pr}</b> (${s.pb})</span></div></section>`;
}
function capped(m,s,i){const w=s.W[i];return !!(m.maxOv&&!s.inn.so&&w&&w.o>=m.maxOv)}
function scoreView(){
  if(S.match.deleted)return noMatch();
  const m=S.match,k=cur(),s=stateOf(m,k);
  let body='';
  const Pb=m.teams[s.inn.bat].players,Pw=m.teams[s.inn.bowl].players;
  const undo='<button class="btn ghost small" data-act="undo">↶ Undo</button>';
  const due=s.need==='ball'&&m.retireAt&&!s.PR&&!s.inn.so?[s.st,s.ns].find(id=>id!=null&&s.B[id].r>=m.retireAt&&!s.B[id].kept):undefined;
  if(m.brk){body=`<section class="callout brk"><h2>${esc(m.brk.type)}</h2><p>${m.brk.note?esc(m.brk.note)+' · ':''}Play stopped at ${new Date(m.brk.ts).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})}</p></section>

  else if(due!==undefined){

      <button class="key" data-act="run" data-v="1">1</button>
      <button class="key" data-act="run" data-v="2">2</button>

    </section>`;
  } else if(s.need==='bat'){
    const avail=s.av;
    body=`<div class="mini-call"><div><h2>Next batter</h2><p>To the ${s.st===null?'striker':'non-striker'}’s end</p></div>${undo}</div>
      <div class="pick two flexscroll">${avail.map(i=>`<button class="opt" data-act="newbat" data-v="${i}"><b>${esc(Pb[i]+rt(m.teams[s.inn.bat],i))}</b><small>${s.B[i]?'Returning, '+s.B[i].out:m.batMax&&i>=m.batMax?'Replaces retired batter':'#'+(i+1)+' in order'}</small></button>`).join('')}</div>`;
  } else if(s.need==='bowl'){
    body='';
  } else if(s.need==='start'){
    const o=UI.open||{st:'',ns:'',bo:''};UI.open=o;
    const sel=(f,list,v)=>{const T=list===Pb?m.teams[s.inn.bat]:m.teams[s.inn.bowl];return `<select id="op-${f}" data-open="${f}"><option value="" ${v===''?'selected':''}>Choose…</option>${list.map((n,i)=>f==='bo'&&T.wk===i?'':`<option value="${i}" ${v!==''&&+v===i?'selected':''}>${esc(n+rt(T,i))}</option>`).join('')}</select>`};
    body=`<div class="mini-call"><div><h2>${esc(m.teams[s.inn.bat].name)} · ${innLabel(m,k)}</h2><p>${s.target?'Need '+s.target+(s.ovl?' from '+s.ovl+' over'+(s.ovl===1?'':'s'):''):s.inn.so?'1 over, 2 wickets':''}</p></div></div>
     <section class="panel" style="display:grid;gap:10px"><div class="field"><label for="op-st">Striker</label>${sel('st',Pb,o.st)}</div><div class="field"><label for="op-ns">Non-striker</label>${sel('ns',Pb,o.ns)}</div><div class="field"><label for="op-bo">Opening bowler</label>${sel('bo',Pw,o.bo)}</div></section>
     ${UI.err?`<p class="err">${esc(UI.err)}</p>`:''}
     <div class="row end">${undo}<button class="btn" data-act="startinn">Start innings</button></div>`;
  } else {
    const res=resultOf(m),nx=!res?nextInn(m):null;
    if(nx){const nb=m.teams[nx.bat].name;
      body=`<section class="callout"><h2>${innLabel(m,k)} complete · ${esc(s.why)}</h2><p>${esc(m.teams[s.inn.bat].name)} made ${s.total}/${s.wk} in ${oversTxt(s,m)} overs.</p></section>
      <div class="row end">${undo}${foOk(m)?`<button class="btn ghost" data-act="nextinn" data-v="fo">Enforce follow-on</button>`:''}<button class="btn" data-act="nextinn" data-v="">Start ${esc(nb)} innings</button></div>`}
    else body=`<section class="callout"><h2>${esc(res||'Innings complete')}</h2>${res?potmLine(m):''}</section>
      <div class="row end">${undo}${res==='Match tied'&&m.inns.length===2&&!m.pairs?'<button class="btn ghost" data-act="superover">Play super over</button>':''}<button class="btn" data-act="newmatch">New match</button></div>`;
  }
  const bar=`<nav class="actbar" aria-label="Match actions"><button data-act="share" data-v="scorer"><span class="ai">✎</span>Scorer link</button><button data-act="share" data-v="public"><span class="ai">◉</span>Public link</button></nav>`;
  return `<div class="col-info">${miniBand(m,k,s)}${s.started&&s.need!=='start'?miniCrease(m,s):''}</div><div class="col-act">${body}${bar}</div>`;
}

function inningsCard(m,k){
  const s=stateOf(m,k),P=m.teams[s.inn.bat].players,Q=m.teams[s.inn.bowl].players;
  const exT=s.ex.b+s.ex.lb+s.ex.wd+s.ex.nb+s.ex.p;
  const rows=s.order.map(id=>{const b=s.B[id];const ret=b.out==='retired not out'||b.out==='retired hurt',notout=!b.out||ret;const duck=b.out&&b.r===0&&!notout;
    if(s.PR)b.out=b.outs?b.outs+'× out (−'+(b.outs*s.PR.pen)+')':null;
    const onS=notout&&id===s.st&&!s.done,isCur=!s.done&&(id===s.st||id===s.ns);
    return `<tr class="${notout?'notout':''}${onS?' onstrike':''}${isCur?' cur':''}"><td class="n">${esc(P[id])}${roleTags(m.teams[s.inn.bat],id)}${!b.out?'<span class="star">*</span>':''}${onS?BAT:''}${b.out?`<span class="how${ret?' ret':''}">${esc(b.out)}${b.out==='retired not out'&&id===replacedId(m,s)?' · replaced':''}</span>`:''}</td><td class="rr">${duck&&!s.PR?(b.b===1?`<span class="gduck" title="golden duck">${DUCK}<small>golden</small></span>`:DUCK):b.r}</td><td>${b.b}</td><td>${b.f}</td><td>${b.s}</td><td>${b.b?(b.r/b.b*100).toFixed(1):'–'}</td></tr>`}).join('');
  const brow=s.wOrder.map(id=>{const w=s.W[id],balls=w.o*6+w.b;return `<tr class="${id===s.bo&&!s.done?'cur':''}"><td class="n">${esc(Q[id])}${roleTags(m.teams[s.inn.bowl],id)}${id===s.bo&&!s.done?BALL:''}</td><td>${w.o}.${w.b}</td><td>${w.m}</td><td>${w.r}</td><td class="rr">${w.w}</td><td>${balls?(w.r/balls*6).toFixed(2):'–'}</td><td>${w.wd}</td><td>${w.nb}</td></tr>`}).join('');
  return `<div class="tbl batblock ${tcl(m,s.inn.bat)} o${tcl(m,s.inn.bowl)}"><table class="sc"><thead><tr><th class="sec">Batting</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div><div class="kv"><span>Extras</span><span><b style="color:var(--ink)">${exT}</b> (b ${s.ex.b}, lb ${s.ex.lb}, w ${s.ex.wd}, nb ${s.ex.nb}, p ${s.ex.p})</span></div>${s.PR&&s.ex.wp?`<div class="kv"><span>Wicket deductions</span><span><b style="color:var(--ink)">−${s.ex.wp}</b></span></div>`:''}
    <div class="total-bar ${tcl(m,s.inn.bat)}"><span class="tb-l">Total<small>${esc(m.teams[s.inn.bat].name)}</small></span><span class="tb-s">${s.total}/${s.wk}</span><span class="tb-m"><b>${oversTxt(s,m)}</b> ov<br>RR <b>${rate(s.total,s.ballsGone)}</b></span></div></div>
    ${s.fow.length?`<div><div class="minihead">Fall of wickets</div><div class="fow">${s.fow.map(f=>`${f.total}-${f.wk} (${esc(P[f.id])}, ${f.ov} ov)`).join(' · ')}</div></div>`:''}
    <div class="tbl bowlblock ${tcl(m,s.inn.bowl)} o${tcl(m,s.inn.bat)}"><table class="sc"><thead><tr><th class="sec">Bowling</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th><th>Wd</th><th>Nb</th></tr></thead><tbody>${brow}</tbody></table></div>`;
}
function bookFig(m,s){const P=m.teams[s.inn.bat].players,Q=m.teams[s.inn.bowl].players,o=s.overs[s.overs.length-1],w=o?s.W[o.bowler]:null;
  const exT=s.ex.b+s.ex.lb+s.ex.wd+s.ex.nb+s.ex.p;
  const bats=[s.st,s.ns].filter(x=>x!=null).map(id=>`${esc(P[id]+rt(m.teams[s.inn.bat],id))} <b>${s.B[id].r}</b> (${s.B[id].b})`);
  return `<div class="bookfig"><div><span>Total</span><b>${s.total}/${s.wk}</b></div><div><span>Overs</span><b>${oversTxt(s,m)}</b></div><div><span>Extras</span><b>${exT}</b></div>
    ${w?`<div class="wide"><span>Bowler</span><b>${esc(Q[o.bowler]+rt(m.teams[s.inn.bowl],o.bowler))} ${w.o}${w.b?'.'+w.b:''}-${w.m}-${w.r}-${w.w}</b></div>`:''}${bats.length?`<div class="wide"><span>Batters</span><b class="nb">${bats.join(' · ')}</b></div>`:''}</div>`}
function chkMark(inn,o){const c=(inn.chk||{})[o];return c?c.s==='ok'?'<span class="ck ok">✓ book</span>':'<span class="ck diff">⚠ check book'+(c.note?': '+esc(c.note):'')+'</span>':''}
function bookView(m,k,s){const P=m.teams[s.inn.bat].players,Q=m.teams[s.inn.bowl].players;
  const bat=s.order.map(id=>{const b=s.B[id];return `<div class="bk-row"><span class="bk-n">${esc(P[id]+rt(m.teams[s.inn.bat],id))}</span><span class="bk-seq">${(b.seq||[]).map(x=>`<i class="${/W/.test(x)?'w':x==='4'?'f':x==='6'?'s':''}">${x}</i>`).join('')||'<i>–</i>'}</span><span class="bk-t">${b.r}${b.out?'':'*'}</span></div>`}).join('');
  const byB={};s.overs.forEach((o,i)=>{(byB[o.bowler]=byB[o.bowler]||[]).push({i,balls:o.balls})});if(s.cur.length&&s.bo!=null)(byB[s.bo]=byB[s.bo]||[]).push({i:s.overs.length,balls:s.cur,live:true});
  const bowl=Object.keys(byB).map(id=>{const w=s.W[id];return `<div class="bk-row"><span class="bk-n">${esc(Q[id]+rt(m.teams[s.inn.bowl],+id))}</span><span class="bk-ovs">${byB[id].map(o=>`<span class="bk-ov${o.live?' live':''}" title="Over ${o.i+1}"><em>${o.i+1}</em>${o.balls.map(c=>`<i class="${c.cls}">${esc(c.chip)}</i>`).join('')}</span>`).join('')}</span><span class="bk-t">${w.o}${w.b?'.'+w.b:''}-${w.m}-${w.r}-${w.w}</span></div>`}).join('');
  return `<div class="minihead">Batting · ball by ball</div><div class="bk">${bat}</div><div class="minihead" style="margin-top:10px">Bowling · over by over</div><div class="bk">${bowl}</div>`}
function ballLog(m,k,s){
  let out='',lastOv=-1;
  s.log.forEach(l=>{const o=parseInt(l.lab);if(o!==lastOv){out+=`<div class="overhead">Over ${o+1} ${chkMark(m.inns[k],o)}</div>`;lastOv=o}
    out+=`<div class="logrow"><span class="ov">${l.lab}</span><span class="chip ${l.cls}">${esc(l.chip)}</span><span class="d">${esc(l.desc)}</span>${l.edit&&!RO?`<button class="btn ghost small" data-act="edit" data-k="${k}" data-i="${l.i}">Edit</button>`:'<span></span>'}</div>`});
  return out||'<p class="muted">No balls yet.</p>';
}
function cardView(){

      ${bv?bookView(m,k,s):`<div class="log">${ballLog(m,k,s)}</div>`}`}
  const tm=i=>{const w=m.toss.w===i;return `<span class="mt-team">${m.teams[i].logo?badge(m.teams[i],20):''}${w?COIN:''}<b class="${tcl(m,i)} ${m.inns[cur()].bat===i?'is-bat':'is-bowl'}">${tn(m,i)}</b>${w?`<span class="tc">${m.toss.d==='bat'?BAT.replace('on strike','chose to bat'):BALL.replace('bowling now','chose to bowl')}</span>`:''}</span>`};

  <section class="cardbox">
    <div class="maintabs" role="tablist">${[['sc','Scorecard','Card'],['bb','Ball by ball','Balls'],['gr','Graphs','Graphs'],['lu','Line-ups','Line-ups']].map(([x,l,sh])=>`<button role="tab" data-act="ctab" data-v="${x}" aria-selected="${t===x}"><span class="lg">${l}</span><span class="shl">${sh}</span></button>`).join('')}</div>
    <div class="innbar">${multi&&t!=='lu'?`<div class="subtabs" role="tablist" style="grid-template-columns:repeat(${m.inns.length},minmax(0,1fr))">${m.inns.map((x,j)=>`<button role="tab" class="${tcl(m,x.bat)}" data-act="cinn" data-v="${j}" aria-selected="${k===j}">${tn(m,x.bat)} ${x.so?'SO':m.innsPer===2?(j<2?'1st':'2nd'):''}</button>`).join('')}</div>`:`<div class="subtabs two" role="tablist">${ord(m).map(i=>`<button role="tab" class="${tcl(m,i)}" data-act="cteam" data-v="${i}" aria-selected="${ti===i}">${tn(m,i)}</button>`).join('')}</div>`}</div>
    <div class="cbody">${body}</div>

}

  <div class="col-info">${miniBand(m,k,s)}${s.started&&s.need!=='start'?miniCrease(m,s):''}</div>

/* setup */
function blankSetup(){const pl=p=>Array.from({length:11},(_, i)=>p+' '+(i+1)).join('\n');
  return {step:1,overs:20,fmt:'std',a:'Home XI',b:'Away XI',pa:pl('Home'),pb:pl('Away'),tw:0,td:'bat',st:0,ns:1,bo:10,fh:'yes'}}
function setupView(){
  const u=S.setup;const steps=['Format & teams','Toss','Openers'];
  let h=`<div class="steps">${steps.map((t,i)=>`<span class="${u.step>=i+1?'on':''}">${i+1} · ${t}</span>`).join('')}</div>`;
  if(u.step===1){
    h+=`<section class="panel" style="display:grid;gap:12px"><div class="grid2">
      <div class="field"><label for="su-overs">Overs per side</label><input id="su-overs" data-f="overs" type="number" min="1" max="50" value="${u.overs}"></div>
      <div class="field"><label for="su-fmt">Over format</label><select id="su-fmt" data-f="fmt">
        <option value="std" ${u.fmt==='std'?'selected':''}>6 legal balls</option>
        <option value="max8" ${u.fmt==='max8'?'selected':''}>6 legal balls · max 8 deliveries (Junior)</option>
        <option value="tot6" ${u.fmt==='tot6'?'selected':''}>6 deliveries including extras (Junior)</option></select></div>
      <div class="field"><label for="su-fh">Free hit after a no ball</label><select id="su-fh" data-f="fh">
        <option value="yes" ${u.fh!=='no'?'selected':''}>Yes, next ball is a free hit</option>
        <option value="no" ${u.fh==='no'?'selected':''}>No free hit in this competition</option></select></div></div>
      <div class="grid2">
        <div class="field"><label for="su-a">Team 1</label><input id="su-a" data-f="a" value="${esc(u.a)}"><label for="su-pa">Players, one per line in batting order</label><textarea id="su-pa" data-f="pa">${esc(u.pa)}</textarea></div>
        <div class="field"><label for="su-b">Team 2</label><input id="su-b" data-f="b" value="${esc(u.b)}"><label for="su-pb">Players, one per line in batting order</label><textarea id="su-pb" data-f="pb">${esc(u.pb)}</textarea></div>
      </div></section>`;
  } else if(u.step===2){
    h+=`<section class="panel" style="display:grid;gap:10px"><h3><span>Who won the toss</span></h3>
      <div class="pick">${[u.a,u.b].map((n,i)=>`<button class="opt" data-act="su" data-f="tw" data-v="${i}" aria-pressed="${u.tw===i}"><b>${esc(n)}</b></button>`).join('')}</div>
      <h3><span>They chose to</span></h3>
      <div class="pick"><button class="opt" data-act="su" data-f="td" data-v="bat" aria-pressed="${u.td==='bat'}"><b>Bat first</b></button><button class="opt" data-act="su" data-f="td" data-v="bowl" aria-pressed="${u.td==='bowl'}"><b>Bowl first</b></button></div></section>`;
  } else {
    const batI=(u.td==='bat')?u.tw:1-u.tw;const Pb=lines(batI?u.pb:u.pa),Pw=lines(batI?u.pa:u.pb);
    const sel=(f,list)=>`<select id="su-${f}" data-f="${f}">${list.map((n,i)=>`<option value="${i}" ${+u[f]===i?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
    h+=`<section class="panel" style="display:grid;gap:12px"><div class="sub">${esc(batI?u.b:u.a)} bat first.</div><div class="grid2">
      <div class="field"><label for="su-st">Striker</label>${sel('st',Pb)}</div><div class="field"><label for="su-ns">Non-striker</label>${sel('ns',Pb)}</div>
      <div class="field"><label for="su-bo">Opening bowler</label>${sel('bo',Pw)}</div></div></section>`;

    <button class="btn ghost" data-act="su-back">${u.step===1?'Cancel':'Back'}</button>
    <button class="btn" data-act="su-next">${u.step===3?'Start match':'Continue'}</button></div>`;
  return h;
}
function lines(t){return t.split('\n').map(x=>x.trim()).filter(Boolean)}

/* ---------- actions ---------- */
function endBreak(m){if(!m.brk)return;const b=(m.breaks||[]).find(x=>x.ts===m.brk.ts);if(b)b.end=Date.now();m.log=m.log||[];m.log.push({ts:Date.now(),by:who(),txt:'Play resumed after '+m.brk.type});m.brk=null}
function push(e){const m=S.match,k=cur(),b4=stateOf(m,k),r0=resultOf(m);e.ts=Date.now();e.by=who();m.inns[k].ev.push(e);UI.sheet=null;UI.err='';
  const a=stateOf(m,k),oe=(e.t==='ball'||e.t==='endov')&&a.ov>b4.ov&&!a.done;
  if(e.t==='ball'&&!e.w&&prefs().ww&&((e.x||'')===''||e.x==='nb')&&(e.r||0)>0)UI.sheet={type:'ww',k,i:m.inns[k].ev.length-1,after:oe};
  else if(oe)UI.sheet={type:'overend'};
  const ms=milestones(m,k,b4,a),r1=resultOf(m);if(!r0&&r1&&prefs().alerts.res)ms.push('RESULT · '+r1);
  render();if(ms.length)toast(ms.join('  ·  '),true)}
function toast(t,big){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;el.className='toast'+(big?' big':'');clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,big?3200:1800)}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v;const m=S.match;

      if(mt[1]==='r')e.r=+mt[2];else if(mt[1]==='wd'){e.x='wd';e.xr=+mt[2]}else if(mt[1]==='nb'){e.x='nb';e.r=+mt[2]}else{e.x=mt[1];e.xr=+mt[2]}
      UI.sheet=null;render();toast('Ball corrected');break}
    case 'copy':navigator.clipboard&&navigator.clipboard.writeText(v).then(()=>toast('Link copied'),()=>{selectUrl()});if(!navigator.clipboard)selectUrl();break;
    case 'role':if(window.CLOUD&&CLOUD.viewer)break;S.tab=S.role==='scorer'?'mine':'admin';render();window.scrollTo(0,0);break;
    case 'opensignup':if(window.CLOUD&&CLOUD.configured){CLOUD.setOpen(!CLOUD.open);break}S.admin.open=!S.admin.open;render();break;
    case 'req':if(window.CLOUD&&CLOUD.configured){const r=CLOUD.reqs()[+b.dataset.i];if(r)CLOUD.setUser(r.e,v);break}S.admin.reqs[+b.dataset.i].s=v;render();toast(v==='approved'?'Scorer approved':'Access blocked');break;
    case 'reset':{const st=S.style;S=fresh();S.style=st;S.tab='score';UI={sheet:null,w:null,err:''};render();toast('Sample match restored');break}
  }
});
function selectUrl(){const el=document.getElementById('shareurl');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Press copy on your keyboard')}
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.brknote){UI.brkN=t.value;return}if(t.dataset.pname){UI.pName=t.value;return}
  if(t.dataset.wsub!=null&&UI.w){UI.w.sub=t.value;return}
  if(t.dataset.tnew){UI.tnew=t.value;return}if(t.dataset.pnew){UI.pnew=t.value;return}
  if(t.dataset.nm){UI.nm=UI.nm||{};UI.nm[t.dataset.nm]=t.value;return}
  if(t.dataset.chknote){UI.chkNote=t.value;return}
  if(t.dataset.rv){UI.rv[t.dataset.rv]=t.value;return}
  if(t.dataset.w&&S.wiz){S.wiz[t.dataset.w]=t.value;save()}
  if(t.dataset.f&&S.setup){S.setup[t.dataset.f]=t.value;save()}
  if(t.dataset.open&&UI.open){UI.open[t.dataset.open]=t.value}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.csfrom){UI.csFrom=t.value;return}
  if(t.dataset.te){const tm=teamById(t.dataset.te),v=t.value.trim();if(tm&&v)tm.name=v;render();return}
  if(t.dataset.pl){const [id,i]=t.dataset.pl.split(':'),tm=teamById(id),v=t.value.trim();if(tm&&v){const old=tm.squad[+i];tm.squad[+i]=v;if(tm.hands&&tm.hands[old]){tm.hands[v]=tm.hands[old];delete tm.hands[old]}}save();return}
  if(t.dataset.logo&&t.files&&t.files[0]){const id=t.dataset.logo;fitLogo(t.files[0],u=>{const tm=teamById(id);if(tm){tm.logo=u;render();toast('Logo added')}});return}
  if(t.dataset.pickbowl){if(t.value!==''){UI.sheet=null;push({t:'bowl',id:+t.value})}return}
  if(t.dataset.wwbat){UI.wwBat=t.value===''?null:+t.value;render();return}
  if(t.dataset.nbowl){UI.nbowl=t.value;UI.err='';return}
  if(t.dataset.potm){S.match.potm=t.value;render();return}
  if(t.dataset.ed){UI.ed=UI.ed||{};UI.ed[t.dataset.ed]=t.value;return}
  if(t.dataset.rv){UI.rv[t.dataset.rv]=t.value;return}
  if(t.dataset.themeSel){S.style=t.value;render();toast((THEMES.find(x=>x.k===t.value)||{}).n+' theme');return}
  if(t.dataset.w&&S.wiz){S.wiz[t.dataset.w]=t.value;
    if(t.dataset.w==='cp'&&t.value==='smca')Object.assign(S.wiz,{ty:'one',overs:'36',ra:'40',bm:'9',lms:'yes',rr:'yes',pr:'off'});
    if(t.dataset.w==='cp'&&t.value!=='smca')Object.assign(S.wiz,{bm:'0',lms:'no',rr:'no',ra:'0'});
    if(t.dataset.w==='fmt'||t.dataset.w==='cp'){const W=S.wiz;if(W.fmt!=='std'||W.cp==='smca')W.ty='one';if(W.fmt==='std'||W.cp==='smca')W.pr='off';if(W.fmt==='std'&&W.cp!=='smca')W.ra='0'}
    if(['a','b','ty','pr','cp','fmt'].includes(t.dataset.w))render();else save()}
  if(t.dataset.f&&S.setup){S.setup[t.dataset.f]=t.value;if(t.dataset.f==='td'||t.dataset.f==='fmt')render();else save()}
  if(t.dataset.open&&UI.open){UI.open[t.dataset.open]=t.value}});
render();
if(window.CLOUD)CLOUD.start();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
